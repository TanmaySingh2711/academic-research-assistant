name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push cancels the older run of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check . --output-format github

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # CPU-only PyTorch: much smaller than the default CUDA build on Linux
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: mypy app.py build_index.py src tests scripts

  setup:
    name: One-click setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ollama must be installed by the user; the setup script then pulls the model itself
      - uses: ./.github/actions/setup-ollama
        with:
          pull-model: "false"

      - name: Run setup.sh (Linux)
        if: runner.os == 'Linux'
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: bash setup.sh
      - name: Run setup.sh (macOS)
        if: runner.os == 'macOS'
        run: bash setup.sh
      - name: Run setup.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call setup.bat < NUL
          exit /b %errorlevel%

      - name: The venv works and puts cache files only in .cache/pycache
        shell: bash
        run: |
          PY=venv/bin/python
          [ -f venv/Scripts/python.exe ] && PY=venv/Scripts/python.exe
          "$PY" -c "import app"
          ls .cache/pycache/app.*.pyc .cache/pycache/src/loader.*.pyc
          found=$(find . -name __pycache__ -not -path "./venv/*")
          if [ -n "$found" ]; then echo "__pycache__ found outside venv:"; echo "$found"; exit 1; fi

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # This job uses the system Python (no venv, so no .cache/pycache helper).
      # The CI machine is deleted after the run, so it simply writes no cache files.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/setup-ollama

      # The real papers are not in the repo, so CI uses generated sample PDFs
      - name: Create sample PDFs
        run: python -m tests.make_sample_pdfs
      - name: Build the index
        run: python build_index.py

      - name: Run the test scripts
        shell: bash
        run: |
          for t in verify_setup test_loader test_chunker test_embedder test_vector_store \
                   test_retriever test_prompt_builder test_generator test_chat_store test_suggestions \
                   test_app test_dashboard; do
            echo "::group::$t"
            python -m "tests.$t"
            echo "::endgroup::"
          done

      - name: No __pycache__ outside venv/
        shell: bash
        run: |
          found=$(find . -name __pycache__ -not -path "./venv/*")
          if [ -n "$found" ]; then echo "__pycache__ found:"; echo "$found"; exit 1; fi
