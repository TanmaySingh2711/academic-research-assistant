name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push cancels the older run of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check . --output-format github

  typecheck:
    name: Type check (mypy, strict for app code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # CPU-only PyTorch: much smaller than the default CUDA build on Linux
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: mypy app.py src scripts evaluation tests

  setup:
    name: One-click setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # OpenCV (used by the offline OCR) needs the OpenGL library on Linux
      - name: System library for OCR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgl1
      # Ollama must be installed by the user; the setup script then pulls the model itself
      - uses: ./.github/actions/setup-ollama
        with:
          pull-model: "false"

      - name: Run setup.sh (Linux)
        if: runner.os == 'Linux'
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: bash setup.sh
      - name: Run setup.sh (macOS)
        if: runner.os == 'macOS'
        run: bash setup.sh
      - name: Run setup.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call setup.bat < NUL
          exit /b %errorlevel%

      - name: The venv works and puts cache files only in .cache/pycache
        shell: bash
        run: |
          PY=venv/bin/python
          [ -f venv/Scripts/python.exe ] && PY=venv/Scripts/python.exe
          "$PY" -c "import app"
          ls .cache/pycache/app.*.pyc .cache/pycache/src/ingest.*.pyc
          found=$(find . -name __pycache__ -not -path "./venv/*")
          if [ -n "$found" ]; then echo "__pycache__ found outside venv:"; echo "$found"; exit 1; fi

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # This job uses the system Python (no venv, so no .cache/pycache helper).
      # The CI machine is deleted after the run, so it simply writes no cache files.
      PYTHONDONTWRITEBYTECODE: "1"
      # Every test must really run here: a test skipped for a missing tool (Ollama, browser,
      # OCR) fails the job instead of passing quietly (see tests/conftest.py)
      REQUIRE_ALL_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System library for OCR and CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libgl1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Download the search models
        run: python scripts/verify_setup.py
      - uses: ./.github/actions/setup-ollama

      # Every test: unit tests, the Flask routes, the browser tests (with the Chrome/Edge that
      # the CI machine already has) and the tests with the real llama3.2:3b
      - name: Run the tests with coverage
        run: python -m coverage run -m pytest -ra
      - name: Coverage (must stay above 90%)
        run: python -m coverage report --fail-under=90

      - name: No __pycache__ outside venv/
        shell: bash
        run: |
          found=$(find . -name __pycache__ -not -path "./venv/*")
          if [ -n "$found" ]; then echo "__pycache__ found:"; echo "$found"; exit 1; fi

  evaluation:
    name: Answer quality (evaluation set)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: ./.github/actions/setup-ollama
      # 68 questions about the 4 evaluation papers: the right chunk must be found and the answer must be right
      - run: python -m evaluation.evaluate --answers --min-hit3 0.95 --min-correct 0.9
