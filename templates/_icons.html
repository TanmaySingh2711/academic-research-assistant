{# Simple line icons as inline SVG (no icon font or CDN, so the page works offline). #}
{% macro icon(name, size=18) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' %}<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/>
{%- elif name == 'chat' %}<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
{%- elif name == 'flow' %}<rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="16" width="7" height="5" rx="1"/><path d="M6.5 8v4.5a2 2 0 0 0 2 2h9V16"/>
{%- elif name == 'history' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'file' %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
{%- elif name == 'upload' %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
{%- elif name == 'database' %}<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
{%- elif name == 'layers' %}<path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
{%- elif name == 'cpu' %}<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
{%- elif name == 'shield' %}<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
{%- elif name == 'quote' %}<path d="M3 21c3 0 7-1 7-8V5H3v7h4c0 4-2 5-4 5zM14 21c3 0 7-1 7-8V5h-7v7h4c0 4-2 5-4 5z"/>
{%- elif name == 'check' %}<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'arrow-right' %}<path d="M5 12h14M12 5l7 7-7 7"/>
{%- elif name == 'arrow-up' %}<path d="M12 19V5M5 12l7-7 7 7"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'paperclip' %}<path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
{%- elif name == 'menu' %}<path d="M3 12h18M3 6h18M3 18h18"/>
{%- elif name == 'code' %}<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>
{%- elif name == 'globe-off' %}<path d="M2 2l20 20"/><path d="M8.5 3.5A10 10 0 0 1 21.6 14.8M18.4 18.5A10 10 0 0 1 3.4 7.2"/>
{%- elif name == 'book' %}<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
{%- elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == 'flag' %}<path d="M4 22V4a1 1 0 0 1 1-1h11l-2 4 2 4H5"/>
{%- endif -%}
</svg>
{%- endmacro %}

{# The app logo: a page with lines and a search lens #}
{% macro logo(size=28) -%}
<svg class="logo" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <rect x="5" y="3" width="18" height="24" rx="3" stroke="currentColor" stroke-width="2"/>
  <path d="M9 9h10M9 13h10M9 17h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="21" r="5" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>
  <path d="m25.5 24.5 3 3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
</svg>
{%- endmacro %}
